<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Panel administrativo local de Stack & Stock Market.">
    <title>Acceso administrativo | Stack & Stock Market</title>
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body class="admin-body">
    <main class="admin-shell">
        <section id="adminLoginView" class="admin-login-view" aria-labelledby="adminLoginTitle">
            <div class="admin-login-card">
                <p class="admin-eyebrow">Stack & Stock Market</p>
                <h1 id="adminLoginTitle">Acceso administrativo</h1>
                <p class="admin-muted">Ingresa para administrar el inventario local.</p>
                <div class="admin-notice admin-notice--info">Demo académica: este acceso funciona solo en tu navegador y <strong>no es autenticación de producción</strong>.</div>
                <form id="adminLoginForm" class="admin-form" novalidate>
                    <label for="adminEmail">Correo electrónico</label>
                    <input id="adminEmail" name="email" type="email" autocomplete="username" required>
                    <small class="admin-field-error" data-error-for="email"></small>
                    <label for="adminPassword">Contraseña</label>
                    <input id="adminPassword" name="password" type="password" autocomplete="current-password" minlength="4" maxlength="10" required>
                    <small class="admin-field-error" data-error-for="password"></small>
                    <button class="admin-button admin-button--primary" type="submit">Ingresar</button>
                    <p id="adminLoginMessage" class="admin-form-message" role="alert"></p>
                </form>
                <a class="admin-back-link" href="index.html">← Volver a la tienda pública</a>
            </div>
        </section>

    </main>
    <script src="assets/js/user-store.js"></script>
    <script src="assets/js/admin-data.js"></script>
    <script src="assets/js/admin-auth.js"></script>
    <script src="assets/js/admin-login.js"></script>
</body>
</html>
